name: EVIE R24 Windows Operator State

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/evie_operator_state.py"
      - "tools/evie_execution_security.py"
      - "tests/test_operator_state.py"
      - "tests/test_execution_security.py"
      - ".github/workflows/windows-operator-state.yml"
  push:
    branches: [main]
    paths:
      - "tools/evie_operator_state.py"
      - "tools/evie_execution_security.py"
      - "tests/test_operator_state.py"
      - "tests/test_execution_security.py"
      - ".github/workflows/windows-operator-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-observations:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only native inspector test requirements
        run: python -m pip install pytest
      - name: Verify native Windows token-user and file owner/DACL observations
        run: python -m pytest -q tests/test_operator_state.py
